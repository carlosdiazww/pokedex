<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKÉDEX Retro</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(135deg, #e3eeff 0%, #f3e7e9 100%);
            min-height: 100vh;
            color: #222;
        }

        /* Barra superior roja estilo retro */
        .top-bar {
            background-color: #e3350d;
            padding: 12px 30px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .top-bar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* Envoltorio principal centrado */
        .wrapper {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
            text-align: center;
        }

        /* Caja de Título POKÉDEX */
        .title-box {
            background: white;
            border: 3px solid #222;
            border-radius: 12px;
            padding: 12px 30px;
            display: inline-block;
            box-shadow: 3px 3px 0px #222;
            margin-bottom: 30px;
        }
        .title-box h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 4px;
            font-weight: 900;
        }
        .title-box p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }

        /* Cuadrícula de Pokémon */
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* Tarjeta Pokémon estilo retro */
        .pokemon-card {
            background: white;
            border: 3px solid #222;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 3px 3px 0px #222;
            transition: transform 0.15s ease-in-out;
        }
        .pokemon-card:hover {
            transform: translateY(-3px);
        }
        .pokemon-card img {
            width: 90px;
            height: 90px;
            image-rendering: pixelated;
        }
        .pokemon-card .num {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #555;
            margin-top: 8px;
        }
        .pokemon-card .name {
            display: block;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .pokemon-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="top-bar">
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="https://github.com/carlosdiazww/pokedex" target="_blank">GitHub ↗️</a>
    </div>

    <div class="wrapper">
        <!-- Título Pokédex -->
        <div class="title-box">
            <h1>POKÉDEX</h1>
            <p>1996 - 2005</p>
        </div>

        <!-- Cuadrícula limpia de Pokémon -->
        <div class="pokemon-grid" id="pokemon-grid">
            <p>Cargando Pokémon...</p>
        </div>
    </div>

    <script>
        async function fetchPokemon() {
            try {
                // Cargamos los primeros 12 Pokémon para una vista limpia
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=12');
                const data = await response.json();
                
                const pokemonList = data.results.map((pokemon, index) => {
                    const id = index + 1;
                    const paddedId = String(id).padStart(3, '0');
                    return {
                        id: id,
                        formattedId: paddedId,
                        name: pokemon.name,
                        image: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png
                    };
                });

                const grid = document.getElementById('pokemon-grid');
                grid.innerHTML = pokemonList.map(pokemon => `
                    <div class="pokemon-card">
                        <img src="${pokemon.image}" alt="${pokemon.name}">
                        <span class="num">${pokemon.formattedId}</span>
                        <span class="name">${pokemon.name}</span>
                    </div>
                `).join('');

            } catch (error) {
                console.error("Error al cargar los Pokémon:", error);
                document.getElementById('pokemon-grid').innerHTML = "<p>Error al cargar los datos.</p>";
            }
        }

        fetchPokemon();
    </script>
</body>
</html>
