<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKÉDEX Retro</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(135deg, #e3eeff 0%, #f3e7e9 100%);
            min-height: 100vh;
            color: #222;
        }

        /* Barra superior roja estilo retro */
        .top-bar {
            background-color: #e3350d;
            padding: 12px 30px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .top-bar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* Envoltorio principal */
        .wrapper {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Caja de Título POKÉDEX */
        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }
        .title-box {
            background: white;
            border: 3px solid #222;
            border-radius: 12px;
            padding: 12px 30px;
            display: inline-block;
            box-shadow: 3px 3px 0px #222;
        }
        .title-box h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 4px;
            font-weight: 900;
        }
        .title-box p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }

        /* Barra de conteo y ordenamiento superior */
        .controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .controls-top select {
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 6px;
            border: 2px solid #222;
            background: white;
        }

        /* Layout de Filtro y Cuadrícula */
        .main-content {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* Panel lateral de filtros */
        .filter-panel {
            width: 220px;
            background: white;
            border: 3px solid #222;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 3px 3px 0px #222;
            flex-shrink: 0;
        }
        .filter-group {
            margin-bottom: 15px;
        }
        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 6px;
            font-family: inherit;
            border: 2px solid #222;
            border-radius: 8px;
            background: #fafafa;
        }

        /* Cuadrícula de Pokémon */
        .pokemon-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        /* Tarjeta Pokémon estilo retro */
        .pokemon-card {
            background: white;
            border: 3px solid #222;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 3px 3px 0px #222;
            transition: transform 0.15s ease-in-out;
        }
        .pokemon-card:hover {
            transform: translateY(-3px);
        }
        .pokemon-card img {
            width: 80px;
            height: 80px;
            image-rendering: pixelated;
        }
        .pokemon-card .num {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #444;
            margin-top: 5px;
        }
        .pokemon-card .name {
            display: block;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            .filter-panel {
                width: 100%;
            }
            .pokemon-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="top-bar">
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="https://github.com/carlosdiazww/pokedex" target="_blank">GitHub ↗️</a>
    </div>

    <div class="wrapper">
        <!-- Título Pokédex -->
        <div class="header-title">
            <div class="title-box">
                <h1>POKÉDEX</h1>
                <p>1996 - 2005</p>
            </div>
        </div>

        <!-- Barra superior de contador y ordenamiento -->
        <div class="controls-top">
            <div><span id="results-count">12</span> results</div>
            <div>
                Order by: 
                <select id="sort-select">
                    <option value="number">Number ↗️</option>
                    <option value="name">Name A-Z</option>
                </select>
            </div>
        </div>

        <div class="main-content">
            <!-- Panel Lateral de Filtros -->
            <div class="filter-panel">
                <div class="filter-group">
                    <label>Version:</label>
                    <select>
                        <option>Green</option>
                        <option>Red</option>
                        <option>Blue</option>
                        <option>Yellow</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>PKMN Name:</label>
                    <input type="text" id="search-input" placeholder="Buscar..." />
                </div>
                <div class="filter-group">
                    <label>PKMN Type:</label>
                    <select id="type-select">
                        <option value="all">All</option>
                        <option value="grass">Grass</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="bug">Bug</option>
                    </select>
                </div>
            </div>

            <!-- Cuadrícula de Pokémon -->
            <div class="pokemon-grid" id="pokemon-grid">
                <p>Cargando Pokédex...</p>
            </div>
        </div>
    </div>

    <script>
        let allPokemon = [];

        // Cambiamos el límite a solo 12 Pokémon para que se vea más limpio
        async function fetchPokemon() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=12');
                const data = await response.json();
                
                allPokemon = data.results.map((pokemon, index) => {
                    const id = index + 1;
                    const paddedId = String(id).padStart(3, '0');
                    return {
                        id: id,
                        formattedId: paddedId,
                        name: pokemon.name,
                        image: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png
                    };
                });

                renderPokemon(allPokemon);
            } catch (error) {
                console.error("Error al cargar los Pokémon:", error);
                document.getElementById('pokemon-grid').innerHTML = "<p>Error al cargar los datos.</p>";
            }
        }

        function renderPokemon(pokemonList) {
            const grid = document.getElementById('pokemon-grid');
            document.getElementById('results-count').innerText = pokemonList.length;
            
            grid.innerHTML = pokemonList.map(pokemon => `
                <div class="pokemon-card">
                    <img src="${pokemon.image}" alt="${pokemon.name}">
                    <span class="num">${pokemon.formattedId}</span>
                    <span class="name">${pokemon.name}</span>
                </div>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allPokemon.filter(p => p.name.toLowerCase().includes(searchTerm));
            renderPokemon(filtered);
        });

        document.getElementById('sort-select').addEventListener('change', (e) => {
            let sorted = [...allPokemon];
            if (e.target.value === 'name') {
                sorted.sort((a, b) => a.name.localeCompare(b.name));
            } else {
                sorted.sort((a, b) => a.id - b.id);
            }
            renderPokemon(sorted);
        });

        fetchPokemon();
    </script>
</body>
</html>
